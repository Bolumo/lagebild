<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lagebild">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Lagebild Messgerät</title>
<style>
:root{--bg:#0b1220;--card:#131c2e;--line:#26324a;--text:#e6edf7;--dim:#8a98b3;--ok:#3ddc97;--warn:#ffb020;--bad:#ff5d5d;--acc:#4da3ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,system-ui,sans-serif;padding:max(14px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
h1{font-size:17px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
button{font:inherit;color:var(--text);background:#1b2740;border:1px solid var(--line);border-radius:10px;padding:10px 8px}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.modes button.on{border-color:var(--acc);color:var(--acc);font-weight:600}
.modes button:disabled{opacity:.4}
#go{width:100%;padding:14px;margin-top:10px;font-size:17px;font-weight:600;background:var(--acc);color:#04101f;border:0}
#go.stop{background:var(--bad);color:#fff}
input{width:100%;font:inherit;font-size:16px;color:var(--text);background:#0e1626;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
.hint{color:var(--dim);font-size:13px;margin-top:6px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;margin-top:6px}
td{padding:4px;border-top:1px solid var(--line);vertical-align:top}td:first-child{color:var(--dim);white-space:nowrap}
video{display:none;width:100%;max-height:220px;margin-top:10px;border-radius:10px;background:#000;object-fit:cover}
ul{list-style:none;margin:6px 0 0;padding:0}
li{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
li span{flex:1}
summary{color:var(--dim)}
</style>
</head>
<body>
<h1>Lagebild Messgerät</h1>

<div class="card">
  <div class="modes" id="modes">
    <button data-m="kontakt">Kontakt</button><button data-m="sonar">Sonar</button><button data-m="puls">Puls</button><button data-m="flug">Flug</button>
  </div>
  <div class="hint" id="info"></div>
  <input id="ref" type="text" autocomplete="off" enterkeyhint="done" placeholder="Referenz, z. B. 14 Atemzüge gezählt, 1 m frontal">
  <button id="go">Start</button>
  <div class="hint bad" id="err"></div>
  <video id="vid" playsinline muted></video>
</div>

<div class="card">
  <div class="hint" id="mac" style="margin-top:0">Mac: –</div>
  <div class="hint" id="lauf">Bereit</div>
  <table id="tab"></table>
</div>

<div class="card"><b>Aufzeichnungen</b><ul id="list"></ul></div>

<script>
'use strict';
/* Messgerät: nimmt je Modus Rohdaten auf und schickt sie an den Mac, von dem die App
   geladen wurde – jede Sekunde für die Live-Anzeige, beim Stopp die ganze Aufzeichnung.
   Jede Aufzeichnung bleibt in der App gespeichert, bis der Mac sie bestätigt hat. */
const $=id=>document.getElementById(id);
const r1=v=>Math.round(v*10)/10,r2=v=>Math.round(v*100)/100,r4=v=>Math.round(v*1e4)/1e4,p6=v=>Number(v.toPrecision(6));
const MODI={
  kontakt:{info:'iPhone flach auf Unterlage oder Körper. Beschleunigung und Drehrate (~100 Hz), Mikrofonpegel (10 Hz).',
    cols:{accel:['ms','ax','ay','az','mit_schwerkraft','rot_alpha','rot_beta','rot_gamma'],pegel:['ms','tief_db_20_80Hz','stimme_db_100_4000Hz']}},
  sonar:{info:'Lautsprecher sendet 19 kHz, Mikrofon hört das Echo. Lautstärke hoch, iPhone 0,3–1 m vor das Ziel.',
    cols:{iq:['ms','I','Q'],pegel:['ms','traeger_db','seitenband_verhaeltnis']}},
  puls:{info:'Frontkamera aufs Gesicht, gleichmäßiges Licht, ruhig halten. Mittleres RGB der Bildmitte je Kamerabild.',
    cols:{rgb:['ms','video_s','r','g','b']}},
  flug:{info:'Mikrofonspektrum 40–400 Hz und stärkster Ton 60–300 Hz (3,3 Hz). Für Überflüge im Freien.',
    cols:{ton:['ms','f_spitze_hz','prominenz_db','tonal'],spek:['ms','db_ab_40Hz_je_bin']}}
};
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let mode=MODI[ls.get('modus')]?ls.get('modus'):'sonar',sess=null,macOk=false;const done=[];

/* ---------- Sensoren: jede Funktion startet den Modus und gibt eine Stopp-Funktion zurück ---------- */
let actx=null;
function ctx(){if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:48000});if(actx.state==='suspended')actx.resume();return actx}
const mic=()=>navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false});
const F0=19000;
const SENS={
  async kontakt(){
    let motionOk=true;
    if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){
      try{motionOk=(await DeviceMotionEvent.requestPermission())==='granted'}catch(e){motionOk=false}}
    const st=await mic(),ac=ctx(),src=ac.createMediaStreamSource(st),an=ac.createAnalyser();
    an.fftSize=4096;an.smoothingTimeConstant=0.3;src.connect(an);
    const buf=new Float32Array(an.frequencyBinCount),binHz=ac.sampleRate/an.fftSize;
    const band=(lo,hi)=>{let s=0,n=0;for(let i=Math.floor(lo/binHz);i<=Math.floor(hi/binHz);i++){s+=10**(buf[i]/10);n++}return 10*Math.log10(s/n+1e-12)};
    const tm=setInterval(()=>{an.getFloatFrequencyData(buf);push('pegel',[r1(band(20,80)),r1(band(100,4000))])},100);
    const onM=e=>{const a=e.acceleration||e.accelerationIncludingGravity;if(!a)return;const r=e.rotationRate||{};
      push('accel',[r4(a.x||0),r4(a.y||0),r4(a.z||0),e.acceleration?0:1,r2(r.alpha||0),r2(r.beta||0),r2(r.gamma||0)])};
    if(motionOk)addEventListener('devicemotion',onM);else $('err').textContent='Bewegungssensor nicht freigegeben – nur Mikrofon.';
    return()=>{clearInterval(tm);removeEventListener('devicemotion',onM);src.disconnect();st.getTracks().forEach(t=>t.stop())};
  },
  async sonar(){
    const st=await mic(),ac=ctx(),src=ac.createMediaStreamSource(st),an=ac.createAnalyser();
    an.fftSize=8192;an.smoothingTimeConstant=0.5;src.connect(an);const buf=new Float32Array(an.frequencyBinCount);
    const osc=ac.createOscillator(),g=ac.createGain();osc.frequency.value=F0;g.gain.value=0.9;osc.connect(g).connect(ac.destination);osc.start();
    // I/Q-Demodulation des Echos: je 4096 Samples ein komplexer Wert (11,7 Hz)
    const proc=ac.createScriptProcessor(4096,1,1),sink=ac.createGain(),dph=2*Math.PI*F0/ac.sampleRate;let ph=0;
    proc.onaudioprocess=ev=>{const x=ev.inputBuffer.getChannelData(0);let I=0,Q=0;
      for(let i=0;i<x.length;i++){I+=x[i]*Math.cos(ph);Q+=x[i]*Math.sin(ph);ph+=dph;if(ph>2*Math.PI)ph-=2*Math.PI}
      push('iq',[p6(I/x.length),p6(Q/x.length)])};
    sink.gain.value=0;src.connect(proc);proc.connect(sink).connect(ac.destination);
    const binHz=ac.sampleRate/an.fftSize,cb=Math.round(F0/binHz);
    const tm=setInterval(()=>{an.getFloatFrequencyData(buf);const lin=i=>10**(buf[i]/10);
      const car=lin(cb-1)+lin(cb)+lin(cb+1);let sb=0;for(let k=4;k<=40;k++)sb+=lin(cb-k)+lin(cb+k);
      push('pegel',[r1(10*Math.log10(car+1e-12)),r4(sb/(car+1e-12))])},150);
    return()=>{clearInterval(tm);try{osc.stop()}catch(e){}[osc,g,proc,sink,src,an].forEach(n=>n.disconnect());st.getTracks().forEach(t=>t.stop())};
  },
  async puls(){
    const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
    const v=$('vid');v.srcObject=st;v.style.display='block';await v.play();
    const cv=document.createElement('canvas');cv.width=cv.height=64;const c=cv.getContext('2d',{willReadFrequently:true});let on=true,last=-1;
    const grab=(now,md)=>{if(!on)return;const t=md?md.mediaTime:v.currentTime;
      if(v.videoWidth&&t!==last){last=t;const sw=v.videoWidth*.4,sh=v.videoHeight*.4;
        c.drawImage(v,(v.videoWidth-sw)/2,(v.videoHeight-sh)/2,sw,sh,0,0,64,64);const d=c.getImageData(0,0,64,64).data;
        let r=0,g=0,b=0;for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2]}const n=d.length/4;push('rgb',[r4(t),r2(r/n),r2(g/n),r2(b/n)])}
      if(v.requestVideoFrameCallback)v.requestVideoFrameCallback(grab);else requestAnimationFrame(grab)};
    grab();
    return()=>{on=false;st.getTracks().forEach(t=>t.stop());v.srcObject=null;v.style.display='none'};
  },
  async flug(){
    const st=await mic(),ac=ctx(),src=ac.createMediaStreamSource(st),an=ac.createAnalyser();
    an.fftSize=32768;an.smoothingTimeConstant=0.6;src.connect(an);const buf=new Float32Array(an.frequencyBinCount),binHz=ac.sampleRate/an.fftSize;
    const lo=Math.floor(40/binHz),hi=Math.floor(400/binHz),l2=Math.floor(60/binHz),h2=Math.floor(300/binHz);
    const tm=setInterval(()=>{an.getFloatFrequencyData(buf);let pk=-Infinity,bi=l2;for(let i=l2;i<h2;i++)if(buf[i]>pk){pk=buf[i];bi=i}
      let f=bi*binHz;const a=buf[bi-1],b=buf[bi],c2=buf[bi+1],p=0.5*(a-c2)/(a-2*b+c2);if(isFinite(p))f=(bi+p)*binHz;
      let avg=0;for(let i=l2;i<h2;i++)avg+=10**(buf[i]/10);avg=10*Math.log10(avg/(h2-l2)+1e-12);const prom=pk-avg;
      push('ton',[r2(f),r1(prom),prom>12?1:0]);push('spek',Array.from(buf.subarray(lo,hi),x=>Math.round(x)))},300);
    return()=>{clearInterval(tm);src.disconnect();st.getTracks().forEach(t=>t.stop())};
  }
};

/* ---------- Aufzeichnung ---------- */
function push(stream,row){const s=sess;if(!s)return;row.unshift(Math.round(performance.now()-s.t0));
  (s.streams[stream]||(s.streams[stream]=[])).push(row);if(macOk)(s.pending[stream]||(s.pending[stream]=[])).push(row)}
const meta=s=>({app:'lagebild-mm',format:2,mode:s.mode,start:s.start,end:s.end||null,ua:s.ua,audio_hz:s.audio_hz!=null?s.audio_hz:(actx?actx.sampleRate:null),reference:s.reference||'',columns:MODI[s.mode].cols});
const json=s=>JSON.stringify(Object.assign(meta(s),{id:s.id,streams:s.streams}));
const rec=s=>({id:s.id,mode:s.mode,start:s.start,end:s.end,ua:s.ua,audio_hz:s.audio_hz,reference:s.reference,streams:s.streams,status:''});
const DB=(()=>{let p=null;  // IndexedDB: Aufzeichnungen überleben Neustarts der App
  const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('lagebild',1);r.onupgradeneeded=()=>r.result.createObjectStore('aufnahmen',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const tx=(art,fn)=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction('aufnahmen',art),q=fn(t.objectStore('aufnahmen'));t.oncomplete=()=>res(q.result);t.onerror=()=>rej(t.error)}));
  return{put:o=>tx('readwrite',st=>st.put(o)),all:()=>tx('readonly',st=>st.getAll())}})();
let wl=null;const wake=async()=>{try{wl=await navigator.wakeLock.request('screen')}catch(e){}};

async function start(){
  $('err').textContent='';
  if(mode!=='puls')ctx();  // Audio im Tipp-Ereignis freischalten (iOS)
  const now=new Date();
  sess={id:mode+'-'+now.toISOString().replace(/[:.]/g,'-'),mode,start:now.toISOString(),ua:navigator.userAgent,t0:performance.now(),streams:{},pending:{},q:Promise.resolve()};
  const s=sess;ui();
  try{s.stopSensor=await SENS[mode]()}catch(e){sess=null;$('err').textContent='Start fehlgeschlagen: '+e.message;ui();return}
  s.timer=setInterval(()=>flush(s),1000);wake();
}
function stop(){
  const s=sess;sess=null;clearInterval(s.timer);try{s.stopSensor&&s.stopSensor()}catch(e){}
  s.end=new Date().toISOString();s.reference=$('ref').value.trim();$('ref').value='';s.audio_hz=actx?actx.sampleRate:null;
  flush(s);if(s.metaSent)s.q=s.q.then(()=>post('api/live',{session:s.id,meta:meta(s),final:true}));
  const r=rec(s);done.push(r);DB.put(r).catch(()=>{});if(wl){wl.release().catch(()=>{});wl=null}ui();senden(r);
}
function flush(s){  // Live-Anzeige auf dem Mac: jede Sekunde die neuen Zeilen
  if(!macOk){s.pending={};return}
  if(!s.metaSent){s.metaSent=true;s.q=s.q.then(()=>post('api/live',{session:s.id,meta:meta(s)}))}
  const ch=s.pending;s.pending={};if(Object.keys(ch).length)s.q=s.q.then(()=>post('api/live',{session:s.id,chunk:ch}));
}
const post=(url,body)=>fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>{if(!r.ok)throw new Error(r.status)}).catch(()=>{});

/* ---------- Mac: Verbindung und vollständige Aufzeichnungen ---------- */
async function pruefen(){
  try{macOk=(await fetch('api/ping',{cache:'no-store'})).ok}catch(e){macOk=false}
  $('mac').textContent=macOk?'Mac: verbunden ✓':'Mac nicht erreichbar – gleiches WLAN? Server läuft? Aufzeichnungen bleiben hier gespeichert.';
  $('mac').className='hint '+(macOk?'ok':'bad');if(macOk)nachholen();
}
async function senden(s){if(s.status==='sendet …')return;s.status='sendet …';ui();
  try{const r=await fetch('api/aufnahme',{method:'POST',headers:{'Content-Type':'application/json'},body:json(s)});s.status=r.ok?'auf dem Mac ✓':'Mac-Fehler '+r.status}
  catch(e){s.status=''}
  DB.put(s).catch(()=>{});ui()}
async function nachholen(){for(const s of done.slice())if(s.status!=='auf dem Mac ✓')await senden(s)}
async function exportS(s){const f=new File([json(s)],s.id+'.json',{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:s.id});return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}

/* ---------- Anzeige (nur Text) ---------- */
function ui(){
  document.querySelectorAll('#modes button').forEach(b=>{b.classList.toggle('on',b.dataset.m===mode);b.disabled=!!sess});
  $('info').textContent=MODI[mode].info;$('go').textContent=sess?'Stopp':'Start';$('go').classList.toggle('stop',!!sess);
  const ul=$('list');ul.innerHTML='';
  if(!done.length)ul.innerHTML='<li><span class="hint" style="margin:0">Noch keine Aufzeichnung.</span></li>';
  done.slice().reverse().forEach(s=>{const li=document.createElement('li'),sp=document.createElement('span');
    const dur=Math.round((new Date(s.end)-new Date(s.start))/1000);
    sp.textContent=new Date(s.start).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})+' · '+s.mode+' · '+dur+' s'+(s.reference?' · '+s.reference:'')+' · '+(s.status||'nur auf dem iPhone');
    li.appendChild(sp);const b=document.createElement('button');b.textContent='Export';b.onclick=()=>exportS(s);li.appendChild(b);ul.appendChild(li)});
  tick();
}
function tick(){
  const s=sess,tab=$('tab');
  if(!s){$('lauf').textContent='Bereit';tab.innerHTML='';return}
  const el=(performance.now()-s.t0)/1000;$('lauf').textContent='Aufnahme läuft · '+el.toFixed(0)+' s';
  tab.innerHTML='';
  for(const [name,cols] of Object.entries(MODI[s.mode].cols)){const rows=s.streams[name]||[],last=rows[rows.length-1];
    let txt=rows.length+' Zeilen · '+(rows.length/Math.max(el,1e-3)).toFixed(1)+' Hz';
    if(last)txt+=' · '+(name==='spek'?(last.length-1)+' Werte':cols.slice(1).map((c,i)=>c+' '+last[i+1]).join(', '));
    const tr=tab.insertRow();tr.insertCell().textContent=name;tr.insertCell().textContent=txt}
}
setInterval(()=>{if(sess)tick()},500);

/* ---------- Bedienung ---------- */
$('modes').onclick=e=>{const m=e.target.dataset&&e.target.dataset.m;if(!m||sess)return;mode=m;ls.set('modus',m);ui()};
$('go').onclick=()=>sess?stop():start();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(sess)wake();pruefen()}});
setInterval(pruefen,10000);
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});  // Speicher nicht vom Browser räumen lassen
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
ui();
DB.all().then(a=>{a.sort((x,y)=>x.start<y.start?-1:1);a.forEach(s=>{if(s.status==='sendet …')s.status=''});done.push(...a);ui()}).catch(()=>{}).then(pruefen);
</script>
</body>
</html>
